<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join our newsletter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <div class="wrap">
    <svg class="logo" viewBox="0 0 40 44" role="img" aria-label="Brand logo" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3b9be0"/>
          <stop offset="0.55" stop-color="#4fb8e0"/>
          <stop offset="1" stop-color="#8ad9b8"/>
        </linearGradient>
      </defs>
      <path d="M20 2 L37 11.5 V32.5 L20 42 L3 32.5 V11.5 Z" fill="url(#g)" stroke="#3a8fd0" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M8 29 L16 19 L21 25 L26 17 L33 28" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 34 L16 25 L21 31 L26 24 L33 33" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <h1>Join our newsletter</h1>
    <p class="lead">
      <span>Keep up with our latest collections, exclusive deals, and special offers!</span>
      <span>We introduce a new collection every week, so stay tuned to snag the hottest items just for you.</span>
    </p>

    <form class="card" id="form" novalidate>
      <div class="field">
        <label for="email" hidden>Email address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address"
               autocomplete="email" inputmode="email" aria-describedby="msg" required>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <button type="submit" id="submit">Subscribe now</button>
      <p class="note">Your email is 100% confidential and won’t send you any spam.</p>
    </form>
  </div>
</main>

<script src="app.js"></script>

</body>
</html>
